<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>클래식로얄</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 16px;
      background: #12151e;
      color: #f4f6fb;
      font-family: 'Segoe UI', Apple SD Gothic Neo, Malgun Gothic, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .game-shell {
      width: 100%;
      max-width: 560px;
      background: #1c2230;
      border: 2px solid #323c54;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }
    .game-title {
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin: 0 0 10px 0;
      color: #ffd166;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #131824;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #2b344b;
    }
    .hud-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .hud-label {
      font-size: 11px;
      color: #9aa7c2;
    }
    .hud-value {
      font-size: 15px;
      font-weight: 700;
    }
    .dmg-sub {
      font-size: 11px;
      color: #fca5a5;
    }
    .timer-box {
      text-align: center;
    }
    .timer-val {
      font-size: 20px;
      font-weight: 800;
      color: #ffd166;
    }
    .timer-val.double-elixir {
      color: #ff5c8a;
    }
    .btn-restart {
      background: #3a6ff7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .btn-restart:hover {
      background: #5181ff;
    }
    .btn-restart:active {
      transform: scale(0.96);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 2px solid #3a4663;
      cursor: crosshair;
      background: #4f8f4b;
    }
    .elixir-section {
      margin-top: 10px;
      background: #131824;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid #2b344b;
    }
    .elixir-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #f0abfc;
    }
    .elixir-slots {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
    }
    .elixir-slot {
      height: 16px;
      background: #232b3e;
      border: 1px solid #384461;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .elixir-slot-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(180deg, #f472b6, #c026d3);
      transition: width 0.08s linear;
    }
    .elixir-slot.full .elixir-slot-fill {
      width: 100%;
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.35);
    }
    .cards-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .card {
      background: #242d42;
      border: 2px solid #3a4766;
      border-radius: 12px;
      padding: 8px 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 92px;
      transition: transform 0.12s, border-color 0.12s, opacity 0.15s;
      position: relative;
    }
    .card:hover:not(.disabled) {
      transform: translateY(-3px);
      border-color: #7ea2ff;
    }
    .card.selected {
      border-color: #ffd166;
      background: #313d59;
      box-shadow: 0 0 14px rgba(255, 209, 102, 0.45);
      transform: translateY(-4px);
    }
    .card.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .card-cost {
      position: absolute;
      top: 6px;
      left: 6px;
      background: #c026d3;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-badge {
      font-size: 20px;
      margin-top: 6px;
      font-weight: 900;
    }
    .card-name {
      font-size: 13px;
      font-weight: 800;
      margin-top: 4px;
    }
    .card-role {
      font-size: 10px;
      color: #b7c4de;
      text-align: center;
      line-height: 1.25;
      margin-top: 2px;
    }
    .next-card-bar {
      margin-top: 8px;
      font-size: 12px;
      color: #9aa7c2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .legend {
      margin-top: 10px;
      font-size: 12px;
      color: #b7c4de;
      background: #131824;
      padding: 10px 12px;
      border-radius: 10px;
      line-height: 1.5;
    }
    .legend strong {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <h1 class="game-title">클래식로얄</h1>

    <div class="hud-top">
      <div class="hud-box">
        <span class="hud-label">적 타워 파괴</span>
        <span class="hud-value" id="enemyDestroyed">0 / 3</span>
        <span class="dmg-sub" id="playerDealtText">입힌 피해: 0</span>
      </div>
      <div class="hud-box timer-box">
        <span class="hud-label" id="phaseLabel">남은 시간</span>
        <span class="timer-val" id="timerText">02:30</span>
      </div>
      <div class="hud-box" style="text-align: right;">
        <span class="hud-label">아군 타워 파괴</span>
        <span class="hud-value" id="playerDestroyed">0 / 3</span>
        <span class="dmg-sub" id="enemyDealtText" style="color: #93c5fd;">받은 피해: 0</span>
      </div>
      <button class="btn-restart" id="restartBtn">재시작</button>
    </div>

    <canvas id="arena" width="520" height="620"></canvas>

    <div class="elixir-section">
      <div class="elixir-header">
        <span>⚡ 엘릭서 (1칸 = 1엘릭서)</span>
        <span id="elixirText">5 / 10</span>
      </div>
      <div class="elixir-slots" id="elixirSlots"></div>
    </div>

    <div class="cards-row" id="cardsRow"></div>

    <div class="next-card-bar">
      <span id="nextCardText">다음 카드: -</span>
      <span id="statusHint">카드를 선택한 뒤 아군 진영을 클릭하세요</span>
    </div>

    <div class="legend">
      <strong>🗡️ 기사:</strong> 방패와 한손검을 든 기본 근접 전사(균형형 체력·공격).<br />
      <strong>⚔️ 이성진:</strong> 붉은 머리띠와 대검을 휘두르는 <strong>근거리 최강 딜러</strong>(전 유닛 중 가장 높은 공격력!).<br />
      <strong>🛡️ 양재강:</strong> 높은 체력의 몸빵 탱커로 공격 및 충돌 시 상대를 <strong>약간 튕겨냄(넉백)</strong>.
    </div>
  </div>

  <script>
    const canvas = document.getElementById('arena');
    const ctx = canvas.getContext('2d');

    const W = canvas.width;
    const H = canvas.height;
    const RIVER_Y = H * 0.5;
    const RIVER_H = 38;
    const DEPLOY_LINE_Y = RIVER_Y + RIVER_H / 2 + 10;
    const TOTAL_TIME = 150; // 기존 90초 + 1분(60초) = 150초(02:30)

    const BRIDGES = [
      { x: 120, width: 66 },
      { x: W - 120, width: 66 }
    ];

    const CARD_DEFS = {
      lee_seongjin: {
        id: 'lee_seongjin',
        name: '이성진',
        cost: 4,
        badge: '⚔️',
        color: '#ff2e4c',
        role: '근거리 최강 딜러',
        hp: 540,
        atk: 215,
        atkSpeed: 0.92,
        range: 35,
        speed: 60,
        radius: 16,
        targetBuildingsOnly: false,
        knockback: 12
      },
      knight: {
        id: 'knight',
        name: '기사',
        cost: 3,
        badge: '🗡️',
        color: '#ffd12e',
        role: '기본 근접 전사',
        hp: 720,
        atk: 72,
        atkSpeed: 1.05,
        range: 32,
        speed: 50,
        radius: 15,
        targetBuildingsOnly: false,
        knockback: 6
      },
      yang_jaegang: {
        id: 'yang_jaegang',
        name: '양재강',
        cost: 4,
        badge: '🛡️',
        color: '#00e5ff',
        role: '넉백 몸빵 탱커',
        hp: 1380,
        atk: 62,
        atkSpeed: 1.15,
        range: 36,
        speed: 42,
        radius: 20,
        targetBuildingsOnly: false,
        knockback: 46
      },
      archer: {
        id: 'archer',
        name: '궁수',
        cost: 3,
        badge: '🏹',
        color: '#ff5cf4',
        role: '원거리 사격',
        hp: 310,
        atk: 64,
        atkSpeed: 0.85,
        range: 145,
        speed: 55,
        radius: 13,
        targetBuildingsOnly: false,
        knockback: 0
      },
      giant: {
        id: 'giant',
        name: '거인',
        cost: 5,
        badge: '🗿',
        color: '#ff851b',
        role: '건물 우선 탱커',
        hp: 1520,
        atk: 85,
        atkSpeed: 1.35,
        range: 36,
        speed: 35,
        radius: 21,
        targetBuildingsOnly: true,
        knockback: 16
      },
      fireball: {
        id: 'fireball',
        name: '파이어볼',
        cost: 4,
        badge: '🔥',
        color: '#ff9f1c',
        role: '광역 마법 주문',
        isSpell: true,
        radius: 68,
        damage: 270
      }
    };

    const ALL_CARD_KEYS = Object.keys(CARD_DEFS);
    let state = {};

    function initElixirSlotsDom() {
      const container = document.getElementById('elixirSlots');
      container.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        const slot = document.createElement('div');
        slot.className = 'elixir-slot';
        slot.innerHTML = `<div class="elixir-slot-fill" id="elixirSlotFill_${i}"></div>`;
        container.appendChild(slot);
      }
    }

    // 기사와 이성진이 연속으로 붙지 않도록 셔플
    function buildSeparatedDeck() {
      let arr = [...ALL_CARD_KEYS];
      for (let attempt = 0; attempt < 25; attempt++) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        let adjacent = false;
        for (let i = 0; i < arr.length - 1; i++) {
          const pair = new Set([arr[i], arr[i + 1]]);
          if (pair.has('knight') && pair.has('lee_seongjin')) {
            adjacent = true;
            break;
          }
        }
        if (!adjacent) break;
      }
      return arr;
    }

    function createTowers() {
      return [
        { id: 'e_left', side: 'enemy', kind: 'princess', x: 120, y: 145, radius: 24, hp: 1300, maxHp: 1300, atk: 65, range: 155, cd: 0, atkSpeed: 1.0, alive: true },
        { id: 'e_right', side: 'enemy', kind: 'princess', x: W - 120, y: 145, radius: 24, hp: 1300, maxHp: 1300, atk: 65, range: 155, cd: 0, atkSpeed: 1.0, alive: true },
        { id: 'e_king', side: 'enemy', kind: 'king', x: W / 2, y: 82, radius: 30, hp: 2300, maxHp: 2300, atk: 80, range: 165, cd: 0, atkSpeed: 1.1, alive: true },
        { id: 'p_left', side: 'player', kind: 'princess', x: 120, y: H - 145, radius: 24, hp: 1300, maxHp: 1300, atk: 65, range: 155, cd: 0, atkSpeed: 1.0, alive: true },
        { id: 'p_right', side: 'player', kind: 'princess', x: W - 120, y: H - 145, radius: 24, hp: 1300, maxHp: 1300, atk: 65, range: 155, cd: 0, atkSpeed: 1.0, alive: true },
        { id: 'p_king', side: 'player', kind: 'king', x: W / 2, y: H - 82, radius: 30, hp: 2300, maxHp: 2300, atk: 80, range: 165, cd: 0, atkSpeed: 1.1, alive: true }
      ];
    }

    function damageTower(tower, rawDmg, attackerSide) {
      if (!tower || !tower.alive) return;
      const actual = Math.min(tower.hp, Math.max(0, rawDmg));
      tower.hp -= actual;
      if (attackerSide === 'player') {
        state.playerTowerDamage += actual;
      } else if (attackerSide === 'enemy') {
        state.enemyTowerDamage += actual;
      }
      if (tower.hp <= 0) {
        tower.hp = 0;
        tower.alive = false;
        state.effects.push({
          type: 'explosion',
          x: tower.x,
          y: tower.y,
          r: 14,
          maxR: 64,
          alpha: 1,
          color: '#ffd166'
        });
      }
    }

    function resetGame() {
      const queue = buildSeparatedDeck();
      state = {
        timeLeft: TOTAL_TIME,
        gameOver: false,
        winner: null,
        winReason: '',
        elixir: 5,
        maxElixir: 10,
        enemyElixir: 5,
        enemyAiTimer: 1.4,
        hand: queue.splice(0, 4),
        queue,
        selectedSlot: null,
        hoverPos: null,
        towers: createTowers(),
        units: [],
        projectiles: [],
        effects: [],
        playerTowerDamage: 0,
        enemyTowerDamage: 0,
        lastTimestamp: performance.now()
      };
      renderCards();
      updateHud();
    }

    function drawCardFromQueue(usedKey) {
      state.queue.push(usedKey);
      return state.queue.shift();
    }

    function spawnUnit(side, key, x, y) {
      const def = CARD_DEFS[key];
      if (!def || def.isSpell) return;
      state.units.push({
        id: Math.random().toString(36).slice(2, 9),
        side,
        type: key,
        name: def.name,
        badge: def.badge,
        color: def.color,
        x,
        y,
        hp: def.hp,
        maxHp: def.hp,
        atk: def.atk,
        atkSpeed: def.atkSpeed,
        cd: 0.25,
        range: def.range,
        speed: def.speed,
        radius: def.radius,
        targetBuildingsOnly: def.targetBuildingsOnly,
        knockback: def.knockback || 0,
        kbVx: 0,
        kbVy: 0,
        hitFlash: 0
      });
      state.effects.push({
        type: 'ring',
        x,
        y,
        r: 8,
        maxR: def.radius + 14,
        alpha: 0.8,
        color: side === 'player' ? '#ffffff' : '#ff595e'
      });
    }

    function castFireball(side, x, y) {
      const def = CARD_DEFS.fireball;
      const startY = side === 'player' ? H - 20 : 20;
      state.projectiles.push({
        kind: 'fireball',
        side,
        startX: x,
        startY,
        x: x,
        y: startY,
        targetX: x,
        targetY: y,
        progress: 0,
        duration: 0.45,
        radius: def.radius,
        damage: def.damage
      });
    }

    function applyKnockback(target, sourceX, sourceY, force) {
      if (!force || force <= 0) return;
      const dx = target.x - sourceX;
      const dy = target.y - sourceY;
      const dist = Math.hypot(dx, dy) || 1;
      const resistance = target.type === 'yang_jaegang' || target.type === 'giant' ? 0.55 : 1.0;
      const push = force * resistance * 5.2;
      target.kbVx += (dx / dist) * push;
      target.kbVy += (dy / dist) * push;
    }

    function resolveFireballImpact(proj) {
      state.effects.push({
        type: 'explosion',
        x: proj.targetX,
        y: proj.targetY,
        r: 12,
        maxR: proj.radius,
        alpha: 0.95,
        color: '#ff7b00'
      });

      for (const u of state.units) {
        if (u.side !== proj.side) {
          const d = Math.hypot(u.x - proj.targetX, u.y - proj.targetY);
          if (d <= proj.radius + u.radius) {
            u.hp -= proj.damage;
            u.hitFlash = 0.15;
            applyKnockback(u, proj.targetX, proj.targetY, 24);
          }
        }
      }
      for (const t of state.towers) {
        if (t.alive && t.side !== proj.side) {
          const d = Math.hypot(t.x - proj.targetX, t.y - proj.targetY);
          if (d <= proj.radius + t.radius) {
            damageTower(t, Math.round(proj.damage * 0.45), proj.side);
            state.effects.push({
              type: 'spark',
              x: t.x,
              y: t.y,
              r: 6,
              maxR: 22,
              alpha: 0.85,
              color: '#ffd166'
            });
          }
        }
      }
    }

    function getNearestBridge(x) {
      let best = BRIDGES[0];
      let bestDist = Math.abs(x - best.x);
      for (const b of BRIDGES) {
        const d = Math.abs(x - b.x);
        if (d < bestDist) {
          bestDist = d;
          best = b;
        }
      }
      return best;
    }

    function findTargetForUnit(unit) {
      let bestEnemyUnit = null;
      let bestUnitDist = Infinity;

      if (!unit.targetBuildingsOnly) {
        for (const other of state.units) {
          if (other.side !== unit.side && other.hp > 0) {
            const d = Math.hypot(other.x - unit.x, other.y - unit.y);
            if (d < bestUnitDist) {
              bestUnitDist = d;
              bestEnemyUnit = other;
            }
          }
        }
      }

      if (bestEnemyUnit && bestUnitDist <= unit.range + 95) {
        return { kind: 'unit', ref: bestEnemyUnit, dist: bestUnitDist };
      }

      let bestTower = null;
      let bestTowerDist = Infinity;
      for (const t of state.towers) {
        if (t.alive && t.side !== unit.side) {
          const d = Math.hypot(t.x - unit.x, t.y - unit.y);
          if (d < bestTowerDist) {
            bestTowerDist = d;
            bestTower = t;
          }
        }
      }

      if (bestTower) {
        return { kind: 'tower', ref: bestTower, dist: bestTowerDist };
      }
      return null;
    }

    function computeMoveGoal(unit, targetInfo) {
      if (!targetInfo) return { x: unit.x, y: unit.y };
      const tx = targetInfo.ref.x;
      const ty = targetInfo.ref.y;

      const onPlayerSide = unit.y > RIVER_Y + RIVER_H / 2;
      const targetOnEnemySide = ty < RIVER_Y - RIVER_H / 2;
      const onEnemySide = unit.y < RIVER_Y - RIVER_H / 2;
      const targetOnPlayerSide = ty > RIVER_Y + RIVER_H / 2;

      if ((onPlayerSide && targetOnEnemySide) || (onEnemySide && targetOnPlayerSide)) {
        const bridge = getNearestBridge(unit.x);
        const entryY = onPlayerSide ? RIVER_Y + RIVER_H / 2 + 12 : RIVER_Y - RIVER_H / 2 - 12;
        const exitY = onPlayerSide ? RIVER_Y - RIVER_H / 2 - 12 : RIVER_Y + RIVER_H / 2 + 12;

        if (Math.abs(unit.y - entryY) > 10 && Math.abs(unit.x - bridge.x) > 12) {
          return { x: bridge.x, y: entryY };
        }
        if (onPlayerSide && unit.y > exitY) {
          return { x: bridge.x, y: exitY };
        }
        if (onEnemySide && unit.y < exitY) {
          return { x: bridge.x, y: exitY };
        }
      }

      return { x: tx, y: ty };
    }

    function updateUnits(dt) {
      for (const u of state.units) {
        if (u.hp <= 0) continue;
        u.cd = Math.max(0, u.cd - dt);
        u.hitFlash = Math.max(0, u.hitFlash - dt);

        if (Math.abs(u.kbVx) > 0.5 || Math.abs(u.kbVy) > 0.5) {
          u.x += u.kbVx * dt;
          u.y += u.kbVy * dt;
          u.kbVx *= Math.pow(0.015, dt);
          u.kbVy *= Math.pow(0.015, dt);
        }

        const targetInfo = findTargetForUnit(u);
        if (targetInfo) {
          const effectiveRange = u.range + (targetInfo.ref.radius || 14);
          if (targetInfo.dist <= effectiveRange) {
            if (u.cd <= 0) {
              u.cd = u.atkSpeed;
              if (u.range > 80 && targetInfo.kind === 'unit') {
                state.projectiles.push({
                  kind: 'arrow',
                  side: u.side,
                  startX: u.x,
                  startY: u.y,
                  x: u.x,
                  y: u.y,
                  targetUnit: targetInfo.ref,
                  targetX: targetInfo.ref.x,
                  targetY: targetInfo.ref.y,
                  progress: 0,
                  duration: 0.22,
                  damage: u.atk,
                  knockback: u.knockback
                });
              } else {
                if (targetInfo.kind === 'tower') {
                  damageTower(targetInfo.ref, u.atk, u.side);
                } else {
                  targetInfo.ref.hp -= u.atk;
                  targetInfo.ref.hitFlash = 0.14;
                  applyKnockback(targetInfo.ref, u.x, u.y, u.knockback);
                }
                state.effects.push({
                  type: 'slash',
                  x: targetInfo.ref.x,
                  y: targetInfo.ref.y,
                  r: 6,
                  maxR: u.type === 'lee_seongjin' ? 32 : 20,
                  alpha: 0.92,
                  color: u.type === 'lee_seongjin' ? '#ff2e4c' : (u.type === 'yang_jaegang' ? '#00e5ff' : '#ffd12e')
                });
              }
            }
          } else {
            const goal = computeMoveGoal(u, targetInfo);
            const dx = goal.x - u.x;
            const dy = goal.y - u.y;
            const dist = Math.hypot(dx, dy) || 1;
            u.x += (dx / dist) * u.speed * dt;
            u.y += (dy / dist) * u.speed * dt;
          }
        }

        u.x = Math.max(u.radius + 8, Math.min(W - u.radius - 8, u.x));
        u.y = Math.max(u.radius + 8, Math.min(H - u.radius - 8, u.y));
      }

      for (let i = 0; i < state.units.length; i++) {
        for (let j = i + 1; j < state.units.length; j++) {
          const a = state.units[i];
          const b = state.units[j];
          if (a.hp <= 0 || b.hp <= 0) continue;
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          const minDist = a.radius + b.radius;
          if (dist > 0 && dist < minDist) {
            const overlap = (minDist - dist) * 0.5;
            const nx = dx / dist;
            const ny = dy / dist;
            a.x -= nx * overlap;
            a.y -= ny * overlap;
            b.x += nx * overlap;
            b.y += ny * overlap;

            if (a.side !== b.side) {
              if (a.type === 'yang_jaegang') applyKnockback(b, a.x, a.y, 14);
              if (b.type === 'yang_jaegang') applyKnockback(a, b.x, b.y, 14);
            }
          }
        }
      }

      state.units = state.units.filter((u) => u.hp > 0);
    }

    function updateTowers(dt) {
      for (const t of state.towers) {
        if (!t.alive) continue;
        t.cd = Math.max(0, t.cd - dt);
        if (t.cd <= 0) {
          let closest = null;
          let minD = Infinity;
          for (const u of state.units) {
            if (u.side !== t.side && u.hp > 0) {
              const d = Math.hypot(u.x - t.x, u.y - t.y);
              if (d <= t.range + u.radius && d < minD) {
                minD = d;
                closest = u;
              }
            }
          }
          if (closest) {
            t.cd = t.atkSpeed;
            state.projectiles.push({
              kind: 'tower_shot',
              side: t.side,
              startX: t.x,
              startY: t.y,
              x: t.x,
              y: t.y,
              targetUnit: closest,
              targetX: closest.x,
              targetY: closest.y,
              progress: 0,
              duration: 0.25,
              damage: t.atk,
              knockback: 0
            });
          }
        }
      }
    }

    function updateProjectiles(dt) {
      for (const p of state.projectiles) {
        p.progress += dt / p.duration;
        const t = Math.min(1, p.progress);

        if (p.kind === 'fireball') {
          p.x = p.startX + (p.targetX - p.startX) * t;
          p.y = p.startY + (p.targetY - p.startY) * t - Math.sin(t * Math.PI) * 55;
          if (p.progress >= 1) {
            resolveFireballImpact(p);
            p.done = true;
          }
        } else {
          if (p.targetUnit && p.targetUnit.hp > 0) {
            p.targetX = p.targetUnit.x;
            p.targetY = p.targetUnit.y;
          }
          p.x = p.startX + (p.targetX - p.startX) * t;
          p.y = p.startY + (p.targetY - p.startY) * t;
          if (p.progress >= 1) {
            if (p.targetUnit && p.targetUnit.hp > 0) {
              p.targetUnit.hp -= p.damage;
              p.targetUnit.hitFlash = 0.12;
              if (p.knockback) {
                applyKnockback(p.targetUnit, p.startX, p.startY, p.knockback);
              }
            }
            p.done = true;
          }
        }
      }
      state.projectiles = state.projectiles.filter((p) => !p.done);
    }

    function updateEffects(dt) {
      for (const ef of state.effects) {
        ef.r += (ef.maxR - ef.r) * Math.min(1, dt * 11);
        ef.alpha -= dt * 2.4;
      }
      state.effects = state.effects.filter((ef) => ef.alpha > 0);
    }

    function updateEnemyAi(dt) {
      const rate = state.timeLeft <= 30 ? 0.72 : 0.42;
      state.enemyElixir = Math.min(state.maxElixir, state.enemyElixir + rate * dt);
      state.enemyAiTimer -= dt;

      if (state.enemyAiTimer <= 0) {
        state.enemyAiTimer = 1.65 + Math.random() * 1.1;
        const affordable = ALL_CARD_KEYS.filter((k) => CARD_DEFS[k].cost <= state.enemyElixir);
        if (affordable.length > 0) {
          const pick = affordable[Math.floor(Math.random() * affordable.length)];
          const def = CARD_DEFS[pick];
          state.enemyElixir -= def.cost;
          const laneX = Math.random() < 0.5 ? 120 + (Math.random() * 40 - 20) : W - 120 + (Math.random() * 40 - 20);
          if (def.isSpell) {
            castFireball('enemy', laneX, H - 175);
          } else {
            spawnUnit('enemy', pick, laneX, 175 + Math.random() * 35);
          }
        }
      }
    }

    function checkGameOver() {
      const eKing = state.towers.find((t) => t.id === 'e_king');
      const pKing = state.towers.find((t) => t.id === 'p_king');

      if (!eKing.alive) {
        state.gameOver = true;
        state.winner = 'player';
        state.winReason = '상대 킹성을 먼저 파괴했습니다!';
        return;
      }
      if (!pKing.alive) {
        state.gameOver = true;
        state.winner = 'enemy';
        state.winReason = '아군 킹성이 먼저 파괴되었습니다!';
        return;
      }
      if (state.timeLeft <= 0) {
        state.timeLeft = 0;
        state.gameOver = true;
        const eDestroyed = state.towers.filter((t) => t.side === 'enemy' && !t.alive).length;
        const pDestroyed = state.towers.filter((t) => t.side === 'player' && !t.alive).length;

        if (eDestroyed > pDestroyed) {
          state.winner = 'player';
          state.winReason = `파괴한 성 수 우위 (${eDestroyed} vs ${pDestroyed})`;
        } else if (pDestroyed > eDestroyed) {
          state.winner = 'enemy';
          state.winReason = `파괴한 성 수 우위 (${pDestroyed} vs ${eDestroyed})`;
        } else if (state.playerTowerDamage > state.enemyTowerDamage) {
          state.winner = 'player';
          state.winReason = `상대 성에 더 많은 피해 (${state.playerTowerDamage} vs ${state.enemyTowerDamage})`;
        } else if (state.enemyTowerDamage > state.playerTowerDamage) {
          state.winner = 'enemy';
          state.winReason = `상대 성 피해 열세 (${state.playerTowerDamage} vs ${state.enemyTowerDamage})`;
        } else {
          state.winner = 'draw';
          state.winReason = `피해량까지 동일 (${state.playerTowerDamage})`;
        }
      }
    }

    function updateElixirSlotsVisual() {
      const whole = Math.floor(state.elixir);
      const frac = state.elixir - whole;

      for (let i = 0; i < 10; i++) {
        const fillEl = document.getElementById(`elixirSlotFill_${i}`);
        const slotEl = fillEl ? fillEl.parentElement : null;
        if (!fillEl || !slotEl) continue;

        if (i < whole) {
          fillEl.style.width = '100%';
          slotEl.classList.add('full');
        } else if (i === whole) {
          fillEl.style.width = `${Math.round(frac * 100)}%`;
          slotEl.classList.remove('full');
        } else {
          fillEl.style.width = '0%';
          slotEl.classList.remove('full');
        }
      }
    }

    function updateHud() {
      const sec = Math.ceil(state.timeLeft);
      const mins = String(Math.floor(sec / 60)).padStart(2, '0');
      const rem = String(sec % 60).padStart(2, '0');
      const timerEl = document.getElementById('timerText');
      const phaseEl = document.getElementById('phaseLabel');
      timerEl.textContent = `${mins}:${rem}`;
      if (state.timeLeft <= 30 && !state.gameOver) {
        timerEl.classList.add('double-elixir');
        phaseEl.textContent = '⚡ 엘릭서 2배!';
      } else {
        timerEl.classList.remove('double-elixir');
        phaseEl.textContent = '남은 시간';
      }

      const eDestroyed = state.towers.filter((t) => t.side === 'enemy' && !t.alive).length;
      const pDestroyed = state.towers.filter((t) => t.side === 'player' && !t.alive).length;
      document.getElementById('enemyDestroyed').textContent = `${eDestroyed} / 3`;
      document.getElementById('playerDestroyed').textContent = `${pDestroyed} / 3`;
      document.getElementById('playerDealtText').textContent = `입힌 피해: ${state.playerTowerDamage}`;
      document.getElementById('enemyDealtText').textContent = `받은 피해: ${state.enemyTowerDamage}`;

      const displayElixir = Math.floor(state.elixir);
      document.getElementById('elixirText').textContent = `${displayElixir} / ${state.maxElixir}`;
      updateElixirSlotsVisual();

      const nextKey = state.queue[0];
      const nextDef = CARD_DEFS[nextKey];
      document.getElementById('nextCardText').textContent = nextDef
        ? `다음 카드: ${nextDef.badge} ${nextDef.name} (${nextDef.cost}엘릭서)`
        : '다음 카드: -';

      const cardEls = document.querySelectorAll('.card');
      state.hand.forEach((key, idx) => {
        const el = cardEls[idx];
        if (!el) return;
        const canAfford = state.elixir >= CARD_DEFS[key].cost && !state.gameOver;
        el.classList.toggle('disabled', !canAfford);
        el.classList.toggle('selected', state.selectedSlot === idx && canAfford);
      });
    }

    function renderCards() {
      const row = document.getElementById('cardsRow');
      row.innerHTML = '';
      state.hand.forEach((key, idx) => {
        const def = CARD_DEFS[key];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'card';
        btn.innerHTML = `
          <span class="card-cost">${def.cost}</span>
          <span class="card-badge">${def.badge}</span>
          <span class="card-name">${def.name}</span>
          <span class="card-role">${def.role}</span>
        `;
        btn.addEventListener('click', () => {
          if (state.gameOver) return;
          if (state.elixir < def.cost) return;
          state.selectedSlot = state.selectedSlot === idx ? null : idx;
          updateHud();
        });
        row.appendChild(btn);
      });
    }

    function drawCastleTower(t) {
      if (!t.alive) {
        ctx.save();
        ctx.fillStyle = 'rgba(30, 35, 45, 0.45)';
        ctx.fillRect(t.x - 16, t.y - 10, 32, 20);
        ctx.restore();
        return;
      }

      const isKing = t.kind === 'king';
      const w = isKing ? 44 : 34;
      const h = isKing ? 42 : 34;
      const left = t.x - w / 2;
      const top = t.y - h / 2;

      const bodyColor = t.side === 'player' ? '#3b82f6' : '#ef4444';
      const darkBody = t.side === 'player' ? '#1d4ed8' : '#b91c1c';
      const stoneColor = '#e2e8f0';
      const stoneBorder = '#334155';

      ctx.save();

      ctx.fillStyle = '#94a3b8';
      ctx.strokeStyle = stoneBorder;
      ctx.lineWidth = 2;
      ctx.fillRect(left - 3, top + h - 7, w + 6, 9);
      ctx.strokeRect(left - 3, top + h - 7, w + 6, 9);

      ctx.fillStyle = bodyColor;
      ctx.fillRect(left, top + 6, w, h - 11);
      ctx.strokeRect(left, top + 6, w, h - 11);

      const pillarW = isKing ? 14 : 10;
      ctx.fillStyle = stoneColor;
      ctx.fillRect(t.x - pillarW / 2, top + 8, pillarW, h - 15);
      ctx.strokeRect(t.x - pillarW / 2, top + 8, pillarW, h - 15);

      const merlonCount = 3;
      const merlonW = w / (merlonCount * 2 - 1);
      ctx.fillStyle = stoneColor;
      for (let i = 0; i < merlonCount; i++) {
        const mx = left + i * merlonW * 2;
        ctx.fillRect(mx, top, merlonW, 7);
        ctx.strokeRect(mx, top, merlonW, 7);
      }

      if (isKing) {
        ctx.fillStyle = darkBody;
        ctx.beginPath();
        ctx.moveTo(t.x - 16, top + 6);
        ctx.lineTo(t.x, top - 11);
        ctx.lineTo(t.x + 16, top + 6);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.moveTo(t.x - 6, top - 11);
        ctx.lineTo(t.x - 4, top - 18);
        ctx.lineTo(t.x, top - 14);
        ctx.lineTo(t.x + 4, top - 18);
        ctx.lineTo(t.x + 6, top - 11);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(isKing ? '킹성' : '성', t.x, t.y + 4);

      const bw = w + 10;
      const bh = 6;
      const bx = t.x - bw / 2;
      const by = top - (isKing ? 26 : 11);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = t.side === 'player' ? '#4ade80' : '#fb7185';
      ctx.fillRect(bx, by, bw * Math.max(0, t.hp / t.maxHp), bh);

      ctx.restore();
    }

    // 기사와 이성진의 외형 디테일을 명확히 다르게 렌더링
    function drawUnitShape(u) {
      ctx.save();
      ctx.fillStyle = u.hitFlash > 0 ? '#ffffff' : u.color;
      ctx.beginPath();
      ctx.arc(u.x, u.y, u.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineWidth = 3;
      ctx.strokeStyle = u.side === 'player' ? '#ffffff' : '#1e1b4b';
      ctx.stroke();

      if (u.type === 'lee_seongjin') {
        // 이성진: 바깥쪽 붉은 공격 오라 링 + 붉은 머리띠 포인트
        ctx.strokeStyle = 'rgba(255, 46, 76, 0.75)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(u.x, u.y, u.radius + 4, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#ff0033';
        ctx.fillRect(u.x - u.radius + 2, u.y - u.radius + 2, (u.radius - 2) * 2, 4);
      } else if (u.type === 'knight') {
        // 기사: 왼쪽 방패 마크 포인트
        ctx.fillStyle = '#f8fafc';
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(u.x - u.radius * 0.55, u.y + 1, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      ctx.font = `${Math.round(u.radius * 1.05)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(u.badge, u.x, u.y + 1);

      ctx.font = 'bold 10px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.lineWidth = 3;
      ctx.strokeText(u.name, u.x, u.y + u.radius + 10);
      ctx.fillText(u.name, u.x, u.y + u.radius + 10);

      const bw = u.radius * 2;
      const bh = 4.5;
      const bx = u.x - bw / 2;
      const by = u.y - u.radius - 8;
      ctx.fillStyle = 'rgba(15,23,42,0.75)';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = u.side === 'player' ? '#4ade80' : '#fb7185';
      ctx.fillRect(bx, by, bw * Math.max(0, u.hp / u.maxHp), bh);
      ctx.restore();
    }

    function drawArena() {
      ctx.fillStyle = '#4f8f4b';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#5ca356';
      ctx.fillRect(82, 0, 76, H);
      ctx.fillRect(W - 158, 0, 76, H);

      if (!state.gameOver && state.selectedSlot !== null) {
        const key = state.hand[state.selectedSlot];
        const def = CARD_DEFS[key];
        if (def && !def.isSpell) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
          ctx.fillRect(0, DEPLOY_LINE_Y, W, H - DEPLOY_LINE_Y);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
          ctx.setLineDash([6, 6]);
          ctx.beginPath();
          ctx.moveTo(0, DEPLOY_LINE_Y);
          ctx.lineTo(W, DEPLOY_LINE_Y);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      ctx.fillStyle = '#2b8cbe';
      ctx.fillRect(0, RIVER_Y - RIVER_H / 2, W, RIVER_H);
      ctx.strokeStyle = '#74c0fc';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, RIVER_Y - RIVER_H / 2);
      ctx.lineTo(W, RIVER_Y - RIVER_H / 2);
      ctx.moveTo(0, RIVER_Y + RIVER_H / 2);
      ctx.lineTo(W, RIVER_Y + RIVER_H / 2);
      ctx.stroke();

      for (const b of BRIDGES) {
        ctx.fillStyle = '#b07d4f';
        ctx.fillRect(b.x - b.width / 2, RIVER_Y - RIVER_H / 2 - 4, b.width, RIVER_H + 8);
        ctx.strokeStyle = '#5c3d21';
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x - b.width / 2, RIVER_Y - RIVER_H / 2 - 4, b.width, RIVER_H + 8);
      }

      for (const t of state.towers) {
        drawCastleTower(t);
      }

      for (const u of state.units) {
        drawUnitShape(u);
      }

      for (const p of state.projectiles) {
        if (p.kind === 'fireball') {
          ctx.fillStyle = '#ff6b00';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 11, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffd166';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = p.kind === 'tower_shot' ? '#fde047' : '#ffffff';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.kind === 'tower_shot' ? 5 : 3.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (const ef of state.effects) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ef.alpha);
        if (ef.type === 'explosion') {
          ctx.fillStyle = ef.color;
          ctx.beginPath();
          ctx.arc(ef.x, ef.y, ef.r, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.strokeStyle = ef.color;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(ef.x, ef.y, ef.r, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      if (!state.gameOver && state.selectedSlot !== null && state.hoverPos) {
        const key = state.hand[state.selectedSlot];
        const def = CARD_DEFS[key];
        if (def) {
          if (def.isSpell) {
            ctx.strokeStyle = 'rgba(255, 159, 28, 0.9)';
            ctx.fillStyle = 'rgba(255, 159, 28, 0.22)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(state.hoverPos.x, state.hoverPos.y, def.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          } else if (state.hoverPos.y >= DEPLOY_LINE_Y) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(state.hoverPos.x, state.hoverPos.y, def.radius, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
      }

      if (state.gameOver) {
        ctx.fillStyle = 'rgba(10, 14, 23, 0.76)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        let titleMsg = '🤝 무승부입니다!';
        if (state.winner === 'player') titleMsg = '🏆 승리했습니다!';
        else if (state.winner === 'enemy') titleMsg = '💀 패배했습니다!';
        ctx.fillText(titleMsg, W / 2, H / 2 - 22);

        ctx.font = '14px sans-serif';
        ctx.fillStyle = '#ffd166';
        ctx.fillText(state.winReason, W / 2, H / 2 + 6);

        ctx.font = '13px sans-serif';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText('상단의 [재시작] 버튼을 눌러 다시 도전하세요', W / 2, H / 2 + 32);
      }
    }

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const scaleY = H / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    canvas.addEventListener('mousemove', (e) => {
      state.hoverPos = getCanvasCoords(e);
    });

    canvas.addEventListener('mouseleave', () => {
      state.hoverPos = null;
    });

    canvas.addEventListener('click', (e) => {
      if (state.gameOver || state.selectedSlot === null) return;
      const pos = getCanvasCoords(e);
      const key = state.hand[state.selectedSlot];
      const def = CARD_DEFS[key];
      if (!def || state.elixir < def.cost) return;

      if (def.isSpell) {
        state.elixir -= def.cost;
        castFireball('player', pos.x, pos.y);
      } else {
        if (pos.y < DEPLOY_LINE_Y) {
          document.getElementById('statusHint').textContent = '⚠️ 아군 진영(점선 아래)에만 유닛을 소환할 수 있습니다!';
          return;
        }
        state.elixir -= def.cost;
        spawnUnit('player', key, pos.x, pos.y);
      }

      const nextKey = drawCardFromQueue(key);
      state.hand[state.selectedSlot] = nextKey;
      state.selectedSlot = null;
      document.getElementById('statusHint').textContent = '카드를 선택한 뒤 아군 진영을 클릭하세요';
      renderCards();
      updateHud();
    });

    document.getElementById('restartBtn').addEventListener('click', resetGame);

    function loop(now) {
      const dt = Math.min(0.05, (now - state.lastTimestamp) / 1000);
      state.lastTimestamp = now;

      if (!state.gameOver) {
        state.timeLeft = Math.max(0, state.timeLeft - dt);
        const elixirRate = state.timeLeft <= 30 ? 1.4 : 0.75;
        state.elixir = Math.min(state.maxElixir, state.elixir + elixirRate * dt);

        updateEnemyAi(dt);
        updateUnits(dt);
        updateTowers(dt);
        updateProjectiles(dt);
        checkGameOver();
      }

      updateEffects(dt);
      drawArena();
      updateHud();

      requestAnimationFrame(loop);
    }

    initElixirSlotsDom();
    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
